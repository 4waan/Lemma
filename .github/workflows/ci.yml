name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm test
      - run: npm run build

  postgres:
    name: postgres race and migration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Same major as compose.yaml; pinned by digest.
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: lemma
          POSTGRES_PASSWORD: lemma_local_only
          POSTGRES_DB: lemma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lemma -d lemma_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEMMA_TEST_DATABASE_URL: postgres://lemma:lemma_local_only@localhost:5432/lemma_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run apps/server/test/postgres.test.ts

  contracts:
    name: forge build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - run: forge build
        working-directory: contracts
      - run: forge test
        working-directory: contracts
        env:
          FOUNDRY_OFFLINE: "true"

  stylus:
    name: stylus engine (cargo test, ABI, reproducible wasm)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # No secrets, no cache and no third-party action: rustup (preinstalled on the
    # image) installs the toolchain pinned in rust-toolchain.toml, and cargo
    # fetches crates checked against Cargo.lock.
    defaults:
      run:
        working-directory: contracts/stylus
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install the pinned toolchain (Rust 1.94.1, wasm32, clippy, rustfmt)
        run: |
          rustup toolchain install --no-self-update
          rustc --version
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: The committed Solidity interface matches the contract
        run: |
          cargo run --locked --quiet -p confidence-contract --features export-abi -- abi > "$RUNNER_TEMP/ICompatibilityConfidence.sol"
          diff -u confidence-contract/ICompatibilityConfidence.sol "$RUNNER_TEMP/ICompatibilityConfidence.sol"
      - name: The contract builds for Stylus, fits and uses no floats (cargo stylus check needs an RPC)
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p confidence-contract --lib
          node scripts/contract-size.mjs
      - name: lemma_confidence.wasm rebuilds byte for byte
        working-directory: .
        run: node packages/confidence/scripts/build-wasm.mjs --check

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-pinned)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
      - name: Scan every commit
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml --log-opts="--all" .
