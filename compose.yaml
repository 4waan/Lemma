services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lemma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lemma_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-lemma}
    ports:
      - "5432:5432"
    volumes:
      - lemma-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lemma} -d ${POSTGRES_DB:-lemma}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lemma-postgres:
