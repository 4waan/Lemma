[package]
name = "confidence-wasm"
description = "lemma-confidence for Node: extern \"C\" exports over plain integers, no WASI, no allocator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib is the wasm module packages/confidence loads; rlib lets `cargo test` call the exports natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
lemma-confidence = { workspace = true }
