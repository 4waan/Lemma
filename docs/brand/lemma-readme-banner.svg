<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">How Lemma works</title>
  <desc id="d">Four steps: the agent checks Lemma for free, buys a tested patch over x402 in USDC, applies it and runs its tests on the developer's machine, and is covered by a USDC bond that refunds a failure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1518"/>
      <stop offset="1" stop-color="#132124"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#5FE7BB"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="20" fill="url(#bg)"/>
  <g font-family="Lexend, 'Instrument Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="58" fill="#5FE7BB" font-size="14" font-weight="600" letter-spacing="2">HOW LEMMA WORKS</text>
    <text x="40" y="92" fill="#EDF3F1" font-size="26" font-weight="600">Reuse a tested integration instead of rebuilding it</text>

    <g transform="translate(40 128)">
      <rect width="196" height="142" rx="14" fill="#172224" stroke="#2A3B3E"/>
      <circle cx="30" cy="32" r="15" fill="#5FE7BB"/>
      <text x="30" y="37" text-anchor="middle" fill="#0E1518" font-size="15" font-weight="700">1</text>
      <text x="18" y="78" fill="#EDF3F1" font-size="19" font-weight="600">Check</text>
      <text x="18" y="104" fill="#93A3A0" font-size="14">Free. A profile of your</text>
      <text x="18" y="122" fill="#93A3A0" font-size="14">project, never its code.</text>
    </g>
    <line x1="242" y1="199" x2="264" y2="199" stroke="#5FE7BB" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(270 128)">
      <rect width="196" height="142" rx="14" fill="#172224" stroke="#2A3B3E"/>
      <circle cx="30" cy="32" r="15" fill="#5FE7BB"/>
      <text x="30" y="37" text-anchor="middle" fill="#0E1518" font-size="15" font-weight="700">2</text>
      <text x="18" y="78" fill="#EDF3F1" font-size="19" font-weight="600">Buy</text>
      <text x="18" y="104" fill="#93A3A0" font-size="14">Cents in USDC over x402,</text>
      <text x="18" y="122" fill="#93A3A0" font-size="14">within your limits.</text>
    </g>
    <line x1="472" y1="199" x2="494" y2="199" stroke="#5FE7BB" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(500 128)">
      <rect width="196" height="142" rx="14" fill="#172224" stroke="#2A3B3E"/>
      <circle cx="30" cy="32" r="15" fill="#5FE7BB"/>
      <text x="30" y="37" text-anchor="middle" fill="#0E1518" font-size="15" font-weight="700">3</text>
      <text x="18" y="78" fill="#EDF3F1" font-size="19" font-weight="600">Apply and test</text>
      <text x="18" y="104" fill="#93A3A0" font-size="14">Whole or not at all, then</text>
      <text x="18" y="122" fill="#93A3A0" font-size="14">its own tests run locally.</text>
    </g>
    <line x1="702" y1="199" x2="724" y2="199" stroke="#5FE7BB" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(730 128)">
      <rect width="190" height="142" rx="14" fill="#11302A" stroke="#1FA27D"/>
      <circle cx="30" cy="32" r="15" fill="#5FE7BB"/>
      <text x="30" y="37" text-anchor="middle" fill="#0E1518" font-size="15" font-weight="700">4</text>
      <text x="18" y="78" fill="#EDF3F1" font-size="19" font-weight="600">Covered</text>
      <text x="18" y="104" fill="#B6E9D6" font-size="14">A failed test is refunded</text>
      <text x="18" y="122" fill="#B6E9D6" font-size="14">from a USDC bond.</text>
    </g>
  </g>
</svg>
