# The end-to-end run's own Solidity: the Stylus engine's stand-in (src/ConfidenceStandIn.sol).
# The compiler and settings of contracts/foundry.toml; no dependencies.
[profile.default]
src = "src"
out = "out"
libs = []
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
auto_detect_remappings = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
